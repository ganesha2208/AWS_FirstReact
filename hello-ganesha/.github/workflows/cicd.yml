name: React Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t hello-ganesha .

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Old Container
        run: |
          docker stop hello-container || true
          docker rm hello-container || true

      - name: Build Docker Image
        run: docker build -t hello-ganesha .

      - name: Run New Container
        run: docker run -d -p 80:80 --name hello-container hello-ganesha

